<!DOCTYPE html>
<html lang="uk">
<head>

<title>Лабораторна робота №3 — Вітковський І.С., ІМ-44, Варіант 6</title>

</head>
<body>

    <h2>Завдання 1. Блочна верстка за допомогою float. Варіант 6</h2>

    <div id="container-float">
        <div id="header" class="block">Text</div>
        <div id="imgbar" class="block">Img.</div>
        <div id="big-img" class="block">Img.</div>
        <div id="side-text" class="block">Text</div>
        <div id="clear"></div>
    </div>

    <h2>Завдання 2. Блочна верстка за допомогою flex. Варіант 6</h2>

    <div id="container-flex">
        <div id="header-fx" class="block">Text</div>
        <div id="imgbar-fx" class="block">Img.</div>
        <div id="row-fx">
            <div id="big-img-fx" class="block">Img.</div>
            <div id="side-text-fx" class="block">Text</div>
        </div>
    </div>

</body>
